name: Rebrand and build COMICO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebrand-comico.yml"

permissions:
  contents: write

jobs:
  rebrand:
    name: Apply COMICO UI changes and build APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q COMICO-mihon-source.zip -d source

      - name: Apply COMICO branding, remove menu sections, and add glass styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source/mihon-main")
          changes = []

          def read(rel):
              p = root / rel
              if not p.exists():
                  raise SystemExit(f"Required source file missing: {rel}")
              return p, p.read_text(encoding="utf-8")

          def write_if_changed(p, before, after, label):
              if before != after:
                  p.write_text(after, encoding="utf-8")
                  changes.append(label)

          def remove_item_with_token(text, token):
              lines = text.splitlines(keepends=True)
              index = next((i for i, line in enumerate(lines) if token in line), None)
              if index is None:
                  return text, False
              start = next((i for i in range(index, -1, -1) if re.match(r"\s*item\s*\{\s*$", lines[i])), None)
              if start is None:
                  return text, False
              depth = 0
              opened = False
              end = None
              for i in range(start, len(lines)):
                  line = lines[i]
                  depth += line.count("{") - line.count("}")
                  if "{" in line:
                      opened = True
                  if opened and depth == 0:
                      end = i + 1
                      break
              if end is None:
                  return text, False
              del lines[start:end]
              return "".join(lines), True

          def remove_function(text, signature):
              lines = text.splitlines(keepends=True)
              idx = next((i for i, line in enumerate(lines) if signature in line), None)
              if idx is None:
                  return text, False
              start = idx
              while start > 0 and lines[start - 1].strip() == "":
                  start -= 1
              if start > 0 and lines[start - 1].strip() == "@Composable":
                  start -= 1
              depth = 0
              opened = False
              end = None
              for i in range(idx, len(lines)):
                  depth += lines[i].count("{") - lines[i].count("}")
                  if "{" in lines[i]:
                      opened = True
                  if opened and depth == 0:
                      end = i + 1
                      break
              if end is None:
                  return text, False
              while end < len(lines) and lines[end].strip() == "":
                  end += 1
              del lines[start:end]
              return "".join(lines), True

          # Remove Support Us and Help from the More screen.
          rel = "app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt"
          p, s = read(rel)
          before = s
          for token in ("MR.strings.label_support_us", "MR.strings.label_help"):
              s, ok = remove_item_with_token(s, token)
              if not ok:
                  raise SystemExit(f"Could not safely remove {token} from {rel}")
          s = s.replace("    onClickSupport: () -> Unit,\n", "")
          s = s.replace("import androidx.compose.material.icons.automirrored.outlined.HelpOutline\n", "")
          s = s.replace("import androidx.compose.material.icons.filled.VolunteerActivism\n", "")
          s = s.replace("import tachiyomi.core.common.Constants\n", "")
          s = s.replace("import androidx.compose.ui.platform.LocalUriHandler\n", "")
          s = s.replace("    val uriHandler = LocalUriHandler.current\n\n", "")
          write_if_changed(p, before, s, "Removed Support Us and Help entries from More screen")

          # Remove the callback and support screen dependency.
          rel = "app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt"
          p, s = read(rel)
          before = s
          s = s.replace("import mihon.feature.support.SupportUsScreen\n", "")
          s = s.replace("            onClickSupport = { navigator.push(SupportUsScreen()) },\n", "")
          write_if_changed(p, before, s, "Removed Support Us navigation callback")

          # Remove the recurring donation/support campaign from startup.
          rel = "app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt"
          p, s = read(rel)
          before = s
          s = "\n".join(line for line in s.split("\n") if line.strip() != "ShowDonationCampaign()")
          s, _ = remove_function(s, "private fun ShowDonationCampaign()")
          s = s.replace("import mihon.feature.support.SupportUsScreen\n", "")
          write_if_changed(p, before, s, "Removed startup Support Us campaign")

          # Make About explicitly COMICO-branded and remove old Mihon website/social links.
          rel = "app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt"
          p, s = read(rel)
          before = s
          old_logo = """                item {
                    LogoHeader(
                        iconPadding = PaddingValues(vertical = 56.dp),
                    )
                }"""
          new_brand = """                item {
                    TextPreferenceWidget(
                        title = "COMICO",
                        subtitle = "Brand",
                    )
                }"""
          if old_logo not in s:
              raise SystemExit("Could not locate About screen brand header")
          s = s.replace(old_logo, new_brand, 1)
          s, privacy_removed = remove_item_with_token(s, "MR.strings.privacy_policy")
          s, links_removed = remove_item_with_token(s, "LinkIcon(")
          if not privacy_removed or not links_removed:
              raise SystemExit("Could not safely remove legacy About links")
          s = s.replace("import eu.kanade.presentation.more.LogoHeader\n", "")
          s = s.replace("import tachiyomi.core.common.Constants\n", "")
          s = s.replace("import tachiyomi.presentation.core.components.LinkIcon\n", "")
          s = s.replace("import tachiyomi.presentation.core.icons.CustomIcons\n", "")
          s = s.replace("import tachiyomi.presentation.core.icons.Discord\n", "")
          s = s.replace("import tachiyomi.presentation.core.icons.Facebook\n", "")
          s = s.replace("import tachiyomi.presentation.core.icons.Github\n", "")
          s = s.replace("import tachiyomi.presentation.core.icons.Reddit\n", "")
          s = s.replace("import tachiyomi.presentation.core.icons.X\n", "")
          write_if_changed(p, before, s, "Rebranded About screen as COMICO and removed Mihon links")

          # Remove the Getting Started guide block from onboarding when it is a standalone LazyColumn item.
          guide_rel = "app/src/main/java/eu/kanade/tachiyomi/ui/more/OnboardingScreen.kt"
          guide_path = root / guide_rel
          if guide_path.exists():
              guide_before = guide_path.read_text(encoding="utf-8")
              guide_after, guide_removed = remove_item_with_token(guide_before, "onboarding_guides_new_user")
              if guide_removed:
                  guide_after, _ = remove_item_with_token(guide_after, "onboarding_guides_returning_user")
                  write_if_changed(guide_path, guide_before, guide_after, "Removed Getting Started guide onboarding item")

          # Apply a restrained translucent/glass-like theme globally through the shared Compose theme.
          rel = "app/src/main/java/eu/kanade/presentation/theme/TachiyomiTheme.kt"
          p, s = read(rel)
          before = s
          required_imports = [
              "import androidx.compose.foundation.background",
              "import androidx.compose.foundation.layout.Box",
              "import androidx.compose.foundation.layout.fillMaxSize",
              "import androidx.compose.ui.graphics.Brush",
          ]
          for imp in required_imports:
              if imp not in s:
                  anchor = "import androidx.compose.foundation.isSystemInDarkTheme"
                  if anchor in s:
                      s = s.replace(anchor, anchor + "\n" + imp, 1)
                  else:
                      raise SystemExit(f"Could not add theme import: {imp}")
          old_theme = """    MaterialExpressiveTheme(
        colorScheme = remember(appTheme, isDark, isAmoled) {
            getThemeColorScheme(
                context = context,
                appTheme = appTheme,
                isDark = isDark,
                isAmoled = isAmoled,
            )
        },
        content = content,
    )"""
          new_theme = """    val baseColorScheme = remember(appTheme, isDark, isAmoled) {
        getThemeColorScheme(
            context = context,
            appTheme = appTheme,
            isDark = isDark,
            isAmoled = isAmoled,
        )
    }
    val glassColorScheme = remember(baseColorScheme) {
        baseColorScheme.copy(
            surface = baseColorScheme.surface.copy(alpha = 0.92f),
            surfaceContainerLowest = baseColorScheme.surfaceContainerLowest.copy(alpha = 0.58f),
            surfaceContainerLow = baseColorScheme.surfaceContainerLow.copy(alpha = 0.66f),
            surfaceContainer = baseColorScheme.surfaceContainer.copy(alpha = 0.74f),
            surfaceContainerHigh = baseColorScheme.surfaceContainerHigh.copy(alpha = 0.80f),
            surfaceContainerHighest = baseColorScheme.surfaceContainerHighest.copy(alpha = 0.86f),
            outlineVariant = baseColorScheme.outlineVariant.copy(alpha = 0.46f),
        )
    }
    MaterialExpressiveTheme(colorScheme = glassColorScheme) {
        Box(
            modifier = androidx.compose.ui.Modifier
                .fillMaxSize()
                .background(
                    Brush.verticalGradient(
                        colors = listOf(
                            baseColorScheme.background,
                            baseColorScheme.surface.copy(alpha = 0.42f),
                            baseColorScheme.background,
                        ),
                    ),
                ),
        ) {
            content()
        }
    }"""
          if old_theme not in s:
              raise SystemExit("Could not locate shared theme block for glassmorphic styling")
          s = s.replace(old_theme, new_theme, 1)
          write_if_changed(p, before, s, "Added shared glassmorphic theme treatment")

          # Rebrand any explicit Android app-name string without altering namespaces or legal notices.
          for p in (root / "app/src/main/res").rglob("strings.xml"):
              before = p.read_text(encoding="utf-8", errors="ignore")
              after = re.sub(
                  r'(<string\s+name="app_name"[^>]*>)\s*Mihon\s*(</string>)',
                  r'\1COMICO\2',
                  before,
                  flags=re.I,
              )
              if before != after:
                  p.write_text(after, encoding="utf-8")
                  changes.append(f"Updated app display name in {p.relative_to(root)}")

          print("Applied changes:")
          for change in changes:
              print(f"- {change}")
          if not changes:
              raise SystemExit("No source changes were applied; refusing to commit an unchanged archive.")
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build COMICO release APK
        working-directory: source/mihon-main
        run: |
          chmod +x gradlew
          sed -i 's/"package_name": "app.mihon"/"package_name": "app.comico"/g' app/google-services.json
          ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater

      - name: Upload COMICO APK
        uses: actions/upload-artifact@v4
        with:
          name: COMICO-glassmorphic-APK
          path: source/mihon-main/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Update source archive in repository
        run: |
          cd source
          zip -qr ../COMICO-mihon-source.zip mihon-main
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMICO-mihon-source.zip
          if git diff --cached --quiet; then
            echo "Source archive already current; nothing to commit."
          else
            git commit -m "Rebrand COMICO UI and apply glassmorphic theme"
            git push
          fi
