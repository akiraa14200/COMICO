name: Build COMICO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build COMICO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract COMICO source
        run: |
          unzip -q COMICO-mihon-source.zip -d source

      - name: Apply COMICO rebrand and glassmorphic theme
        run: python3 scripts/rebrand_comico.py source/mihon-main

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Firebase package for COMICO
        working-directory: source/mihon-main
        run: |
          sed -i 's/"package_name": "app.mihon"/"package_name": "app.comico"/g' app/google-services.json

      - name: Build COMICO APK
        working-directory: source/mihon-main
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater

      - name: Find APK
        run: |
          echo "APK files:"
          find source/mihon-main/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload COMICO APK
        uses: actions/upload-artifact@v4
        with:
          name: COMICO-APK
          path: source/mihon-main/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Save modified source archive back to repository
        run: |
          cd source
          zip -qr ../COMICO-mihon-source.zip mihon-main
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COMICO-mihon-source.zip
          if git diff --cached --quiet; then
            echo "Source archive already up to date."
          else
            git commit -m "Rebrand COMICO UI and add glassmorphic styling"
            git push
          fi
