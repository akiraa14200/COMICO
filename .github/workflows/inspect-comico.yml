name: Inspect COMICO branding and settings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-comico.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q COMICO-mihon-source.zip -d source
      - name: Print branding and settings matches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mihon-main")
          terms = re.compile(r"starting guide|support us|help|mihon|about|app_name|theme|navigation", re.I)
          exts = {".kt", ".xml", ".kts", ".properties"}
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in exts or "build" in p.parts:
                  continue
              try: lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
              except Exception: continue
              found = [(i, line.strip()) for i, line in enumerate(lines, 1) if terms.search(line)]
              if found and (p.suffix.lower() in {".kt", ".xml"}):
                  print(f"\\n### {p}")
                  for i, line in found[:22]:
                      print(f"{i}: {line[:220]}")
          PY
