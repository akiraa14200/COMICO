name: Inspect COMICO onboarding sections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-comico.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q COMICO-mihon-source.zip -d source
      - name: Print guide step implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/mihon-main")
          for p in root.rglob("GuidesStep.kt"):
              if "build" in p.parts:
                  continue
              lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
              print(f"\\n### {p} ({len(lines)} lines)")
              for i, line in enumerate(lines, 1):
                  print(f"{i}: {line}")
          PY
