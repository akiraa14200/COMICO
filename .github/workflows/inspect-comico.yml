name: Inspect COMICO onboarding sections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-comico.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        run: unzip -q COMICO-mihon-source.zip -d source
      - name: Print onboarding and More screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/mihon-main")
          targets = [
              "app/src/main/java/eu/kanade/tachiyomi/ui/more/OnboardingScreen.kt",
              "app/src/main/java/eu/kanade/presentation/more/MoreScreen.kt",
          ]
          for rel in targets:
              p = root / rel
              if not p.exists():
                  print(f"Missing: {rel}")
                  continue
              print(f"\\n### {rel}")
              for i, line in enumerate(p.read_text(encoding="utf-8", errors="ignore").splitlines(), 1):
                  print(f"{i}: {line}")
          PY
