name: Inspect COMICO source for rebranding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-comico.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -q COMICO-mihon-source.zip -d source
      - name: Print key UI implementation files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/mihon-main")
          targets = {
              "app/src/main/java/eu/kanade/tachiyomi/ui/more/MoreTab.kt": None,
              "app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt": [(330, 470), (570, 625)],
              "app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt": None,
              "app/src/main/java/eu/kanade/presentation/theme/TachiyomiTheme.kt": None,
              "app/src/main/java/eu/kanade/presentation/more/settings/screen/SettingsMainScreen.kt": None,
              "i18n/src/commonMain/moko-resources/base/strings.xml": [(25, 50), (200, 230), (650, 700), (1060, 1090)],
              "app/src/main/res/values/strings.xml": None,
          }
          for rel, ranges in targets.items():
              p = root / rel
              if not p.exists():
                  print(f"\\n### MISSING {rel}")
                  continue
              lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
              print(f"\\n### {rel} ({len(lines)} lines)")
              spans = ranges or [(1, min(len(lines), 260))]
              for a, b in spans:
                  print(f"--- lines {a}-{min(b, len(lines))} ---")
                  for i in range(a, min(b, len(lines)) + 1):
                      print(f"{i}: {lines[i-1]}")
          PY
