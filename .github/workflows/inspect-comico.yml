name: Inspect COMICO source for rebranding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-comico.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -q COMICO-mihon-source.zip -d source
      - name: Print exact UI labels and likely implementation files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("source/mihon-main")
          exact = re.compile(r"Starting Guide|Support Us|label_support_us|pref_category_about|About|Help|mihon\.app|Mihon", re.I)
          for base in [root / "app/src/main", root / "i18n/src/commonMain/moko-resources/base"]:
              if not base.exists():
                  continue
              for p in base.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".kt", ".kts", ".xml", ".json", ".properties"}:
                      continue
                  try:
                      lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
                  except Exception:
                      continue
                  hits = [(i, line.strip()) for i, line in enumerate(lines, 1) if exact.search(line)]
                  if hits:
                      print(f"\\n### {p}")
                      for i, line in hits[:35]:
                          print(f"{i}: {line[:300]}")
          print("\\n### APP SOURCE FILES (navigation/theme/about candidates)")
          for p in sorted((root / "app/src/main").rglob("*.kt")):
              rel = str(p.relative_to(root))
              if any(k in rel.lower() for k in ("settings", "about", "navigation", "theme", "mainactivity", "screen")):
                  print(rel)
          PY
