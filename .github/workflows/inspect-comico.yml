name: Inspect COMICO source for rebranding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-comico.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -q COMICO-mihon-source.zip -d source
      - name: Print More screen implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("source/mihon-main")
          for p in root.rglob("MoreScreen.kt"):
              if "build" in p.parts:
                  continue
              lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
              print(f"\\n### {p} ({len(lines)} lines)")
              for i, line in enumerate(lines, 1):
                  print(f"{i}: {line}")
          for rel, ranges in {
              "app/src/main/java/eu/kanade/tachiyomi/ui/main/MainActivity.kt": [(180, 280), (360, 475)],
              "app/src/main/java/eu/kanade/presentation/more/settings/screen/about/AboutScreen.kt": [(80, 210)],
              "app/src/main/java/eu/kanade/presentation/theme/TachiyomiTheme.kt": [(52, 105)],
          }.items():
              p = root / rel
              if p.exists():
                  lines = p.read_text(encoding="utf-8", errors="ignore").splitlines()
                  print(f"\\n### {rel}")
                  for a,b in ranges:
                      for i in range(a, min(b,len(lines))+1):
                          print(f"{i}: {lines[i-1]}")
          PY
